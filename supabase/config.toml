# Supabase CLI config. Минимальный — фиксируем только то, что должно жить в
# репозитории. Незаданные ключи берут дефолты CLI.
project_id = "ukazhtpqbutmuyixjytx"

# delete-account удаляет аккаунт вызывающего и все его данные под service role.
# Verify JWT обязан быть ВКЛЮЧЁН: платформа отбивает неаутентифицированные
# вызовы до кода функции, а сама функция резолвит юзера из токена, поэтому
# удалить можно только себя. Держим это в конфиге, а не только тумблером в Dashboard.
[functions.delete-account]
verify_jwt = true
