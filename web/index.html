<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index,follow">
<title>afkaf — Safe dog walks in the heat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#2c5f25;
    --bg:#e8f0e6;
    --ink:#1d2b1a;
    --muted:#5a6b55;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 20px;
  }
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;color:var(--green);font-size:44px;letter-spacing:-1px}
  .brand .paw{font-size:44px}
  .taglines{margin:24px 0 32px}
  .taglines p{margin:5px 0;font-size:19px;font-weight:600;color:var(--ink)}
  .taglines p.he{direction:rtl}
  .cta{
    display:inline-block;background:var(--green);color:#fff;text-decoration:none;
    font-weight:800;font-size:17px;border-radius:999px;padding:14px 36px;
    box-shadow:0 2px 6px rgba(44,95,37,.25);
  }
  footer{margin-top:36px;color:var(--muted);font-size:14px}
  footer a{color:var(--green);text-decoration:none;font-weight:700}
</style>
</head>
<body>
  <div class="brand"><span class="paw">🐾</span> afkaf</div>

  <div class="taglines">
    <p class="he" dir="rtl">טיולים בטוחים עם הכלב בחום</p>
    <p>Safe dog walks in the heat</p>
    <p>Безопасные прогулки с собакой в жару</p>
  </div>

  <a class="cta" href="#">TestFlight</a>

  <footer>
    <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a>
  </footer>
</body>
</html>
