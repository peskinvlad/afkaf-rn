# Static site for afkaf.netlify.app — served from web/. No build step.
[build]
  publish = "web"
  # Skip the deploy unless web/ or this file changed (0 = skip, non-0 = build).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- web/ netlify.toml"

# Pretty URLs → the actual .html files (200 = rewrite, URL stays clean).
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/delete-account"
  to = "/delete-account.html"
  status = 200

# Security headers for all pages. CSP is Report-Only for now (observe, don't block).
# fonts.googleapis.com (stylesheet) + fonts.gstatic.com (woff2) are allowed because
# index.html loads Google Fonts (Nunito); no other external scripts/iframes/forms exist.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'"
